<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Только футер</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Вся страница — флекс-колонка; футер уезжает вниз за счёт margin-top:auto */
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: #fff;
    }
    footer {
      margin-top: auto;                 /* магия «прижатия» к низу */
      padding: 16px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
      color: #555;
      background: #f9fafb;
      font-size: 14px;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <footer>
    © 2025 Мой Сайт · <a href="#">Политика конфиденциальности</a>
  </footer>
</body>
</html>
