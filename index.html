<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Простейшая страница — только шапка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Минимальные стили */
    body { margin: 0; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fff;
      position: sticky; top: 0; /* можно убрать, если не нужна фиксация */
    }
    .brand { font-weight: 700; text-decoration: none; color: #111; }
    nav a { margin: 0 8px; text-decoration: none; color: #111; }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#">Мой Сайт</a>
    <nav aria-label="Основное меню">
      <a href="#">Главная</a>
      <a href="#">О нас</a>
      <a href="#">Контакты</a>
    </nav>
  </header>
</body>
</html>
